name: Generate mobile preview image assets

on:
  push:
    branches:
      - agent/mobile-accessibility-performance
    paths:
      - .github/workflows/generate-mobile-preview-assets.yml

permissions:
  contents: write

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-accessibility-performance
          fetch-depth: 0

      - name: Install WebP-capable ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp

      - name: Generate responsive brand and logo assets
        run: |
          set -euo pipefail
          for source in public/brands/*.jpg; do
            name="${source##*/}"
            stem="${name%.jpg}"
            convert "$source" -auto-orient -strip -resize '180x180>' -quality 82 "public/brands/${stem}-180.webp"
            convert "$source" -auto-orient -strip -resize '360x360>' -quality 82 "public/brands/${stem}-360.webp"
          done
          convert public/proto-logo.webp -strip -resize '128x128>' -quality 85 public/proto-trading-online-icon.webp

      - name: Commit generated assets and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brands/*-180.webp public/brands/*-360.webp public/proto-trading-online-icon.webp
          git rm .github/workflows/generate-mobile-preview-assets.yml
          git commit -m "Generate responsive mobile image assets [skip ci]"
          git push origin HEAD:agent/mobile-accessibility-performance
